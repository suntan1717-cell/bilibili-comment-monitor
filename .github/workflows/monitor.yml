name: B站UP主评论监控

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟运行一次（关键修改）
  workflow_dispatch:        # 保留手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 运行监控脚本
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          UP_MID: ${{ secrets.UP_MID }}
          BV_ID: ${{ secrets.BV_ID }}
        run: |
          python bilibili_monitor.py
      
      - name: 保存历史评论记录（关键：持久化对比数据）
        uses: actions/upload-artifact@v4
        with:
          name: comment-history
          path: comment_history.txt
          retention-days: 1  # 记录保留1天，足够5分钟对比
