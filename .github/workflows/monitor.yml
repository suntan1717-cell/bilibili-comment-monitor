name: B站UP主评论监控

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟执行
  workflow_dispatch:

permissions:
  contents: write   # ✅ 必须，否则无法 push

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2️⃣ Python环境
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ 安装依赖
      - name: 📦 安装依赖
        run: pip install requests

      # 4️⃣ 运行脚本
      - name: ▶️ 运行监控
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}  
          UP_MID: ${{ secrets.UP_MID }}
          BV_ID: ${{ secrets.BV_ID }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: python bilibili_monitor.py

      # 5️⃣ 保存去重数据（最终稳定版）
      - name: 💾 保存去重数据
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # ✅ 添加文件
          git add last_comment_ids.json last_push_time.json || true

          # ✅ 如果有变化才提交
          if ! git diff --cached --quiet; then
            git commit -m "update comment ids"
          else
            echo "No changes to commit"
          fi

          # ✅ 拉取远程最新（防冲突）
          git pull --rebase || echo "Rebase skipped"

          # ✅ 推送
          git push || echo "Nothing to push"
