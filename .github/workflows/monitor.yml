name: B站UP主评论监控

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:  # 把env移到这里，强制生效
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装requests库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行监控脚本
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          UP_MID: ${{ secrets.UP_MID }}
          VIDEO_AID: ${{ secrets.VIDEO_AID }}
        run: python bilibili_monitor.py

      - name: 保存推送记录
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "更新已推送评论ID"
          file_pattern: "sent_rpids.txt"
