name: B站UP主评论监控
- name: 💾 保存去重数据
  run: |
    git config --global user.name "github-actions"
    git config --global user.email "actions@github.com"

    # ✅ 先 add
    git add last_comment_ids.json last_push_time.json || true

    # ✅ 再 commit（如果有变更）
    git diff --cached --quiet || git commit -m "update comment ids"

    # ✅ 再 pull（避免冲突）
    git pull --rebase

    # ✅ 最后 push
    git push
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # ✅ 必须加，否则不能 push

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install requests

      - name: ▶️ 运行监控
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          UP_MID: ${{ secrets.UP_MID }}
          BV_ID: ${{ secrets.BV_ID }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: python bilibili_monitor.py

      # ✅ 核心：保存去重数据（关键步骤）
      - name: 💾 保存去重数据
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # 防止冲突
          git pull --rebase

          git add last_comment_ids.json last_push_time.json || true

          # 只有有变更才提交
          git diff --cached --quiet || git commit -m "update comment ids"

          git push
