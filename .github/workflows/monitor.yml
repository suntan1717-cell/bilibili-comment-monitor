name: B站UP主评论监控

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          UP_MID: ${{ secrets.UP_MID }}
          BV_ID: ${{ secrets.BV_ID }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}  # 必须保留这一行
        run: python bilibili_monitor.py
