name: B站UP主评论监控

on:
  schedule:
    # 每2分钟运行一次（可改，比如*/5=每5分钟）
    - cron: '*/2 * * * *'
  workflow_dispatch:  # 手动触发开关

env:
  # 强制使用Node.js 24，消除警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 设置Python环境
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖
      - name: 安装requests库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 运行监控脚本
      - name: 执行监控脚本
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          UP_MID: ${{ secrets.UP_MID }}
          VIDEO_AID: ${{ secrets.VIDEO_AID }}
        run: python bilibili_monitor.py

      # 保存已推送记录（防止重复推送）
      - name: 保存推送记录
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "更新已推送评论ID"
          file_pattern: "sent_rpids.txt"
